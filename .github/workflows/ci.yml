name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest -v

  docker:
    name: docker build + smoke check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-code-audit .

      - name: Start container
        run: |
          docker run -d -p 8080:8080 --name audit ai-code-audit
          for i in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' audit)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs audit
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check endpoints
        run: |
          pip install requests==2.34.2
          python scripts/check_endpoints.py http://localhost:8080

      - name: Container logs
        if: always()
        run: docker logs audit
